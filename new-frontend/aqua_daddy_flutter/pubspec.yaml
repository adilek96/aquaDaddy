name: aqua_daddy_flutter
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2
  flutter_riverpod: ^2.5.1
  dio: ^5.5.0+1
  go_router: ^14.2.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  cached_network_image: ^3.3.1
  fl_chart: ^0.68.0
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  flutter_dotenv: ^5.0.2
  cupertino_icons: ^1.0.5
  flutter_svg: ^2.0.7
  json_annotation: ^4.9.0
  riverpod_annotation: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.3.10
  custom_lint: ^0.6.4
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon-310x310.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A1F2E"
  adaptive_icon_foreground: "assets/icons/icon-192x192.png"
  web:
    generate: false
  windows:
    generate: false

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/logo.svg
    - assets/app-logo.svg
    - assets/placeholder-user.jpg
    - assets/2.riv
    - assets/icons/
